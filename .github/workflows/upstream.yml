name: Upstream mmdb

on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

jobs:
  upstream:
    name: Default database resolves a real IP
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: yarn install --immutable
      - run: yarn build
      - run: E2E_LIVE=1 yarn e2e:pack
